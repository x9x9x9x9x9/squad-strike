name: Symbolize v1.0.1 crash
on: push
jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 toolchain (x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 ninja-build cabextract
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Build and package
        env:
          TARGET_ARCH: x86_64
        run: tools/package_windows.sh
      - name: Symbolize
        if: always()
        run: |
          EXE=build-win/melee.exe
          x86_64-w64-mingw32-objdump -f "$EXE" | head
          x86_64-w64-mingw32-nm -C "$EXE" | wc -l
          for a in 0x102453c5 0x10121300 0x10078d9a 0x10347260 0x10186b04 0x10186f53 0x1017129b 0x101717b8 0x1017bbc4 0x10007fd3 0x100074e3; do
            echo "== $a"; x86_64-w64-mingw32-addr2line -f -C -i -e "$EXE" $a
          done
          echo "== nearest symbols"
          x86_64-w64-mingw32-nm -n -C "$EXE" | awk '{print}' > syms.txt
          for a in 102453c5 10121300 10078d9a 10347260 10186b04 10186f53 1017129b 101717b8 1017bbc4; do
            python3 - "$a" <<'PY'
          import sys
          a=int(sys.argv[1],16); best=None
          for line in open('syms.txt'):
              p=line.split(None,2)
              if len(p)<3: continue
              try: v=int(p[0],16)
              except: continue
              if v<=a and p[1] in 'tT': best=(v,p[2].strip())
          print(hex(a), best[1] if best else '?', '+'+hex(a-best[0]) if best else '')
          PY
          done
          echo "== disasm around fault"
          x86_64-w64-mingw32-objdump -d --start-address=0x10245360 --stop-address=0x102453e0 "$EXE" | tail -40
